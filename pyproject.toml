[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graids-selected-source-demo"
version = "0.1.0"
description = "Selected GRAIDS relay-mapping code with a synthetic offline demonstration"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
